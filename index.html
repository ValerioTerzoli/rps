<!--
Rock Paper Scissors
1=Rock
2=Paper
3=Scissors
Prompt to user for number
Computer generates random number
Checks for winner
Increases win count
1 match = best of 3, max 5 rounds
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function getRandomInt(min, max){
            return Math.floor(Math.random() * (max - min + 1) + min);
        }

        function getComputerChoice(){
            let i = getRandomInt(1,3);
            switch(i){
                case 1: return "rock";
                case 2: return "paper";
                case 3: return "scissors";
            }
        }

        function getPlayerChoice(){
            return prompt("Input your choice:").toLowerCase();
        }    

        function playRound(player,computer){
            if(player === computer) console.log("Tie");
            else if(player === "rock"){
                if(computer === "paper"){
                    console.log("Lose Round");
                    CPU++;
                }
                else{      //only option left is rock - scissors
                    console.log("Win Round");
                    P++;
                }
            }
            else if(player === "paper"){
                if(computer === "scissors"){
                    console.log("Lose Round");
                    CPU++;
                }
                else{      //only option left is paper - rock
                    console.log("Win Round");
                    P++;
                }
            }
            else if(player === "scissors"){
                if(computer === "rock"){
                    console.log("Lose Round");
                    CPU++;
                }
                else{      //only option left is scissors - paper
                    console.log("Win Round");
                    P++;
                }
            }
        }

        function playGame(PTW){ //PTW=Points To Win
            while(PTW > P && PTW > CPU){
                playRound(getPlayerChoice(),getComputerChoice());
            }
            if(P === PTW) console.log("You Win!");
            else console.log("You Lose!");
            console.log("Score:");
            console.log("P= " + P);
            console.log("CPU= " + CPU);
        }
        //global variables
        let P = 0;      //P=player points
        let CPU = 0;    //CPU=computer points
        playGame(parseInt(prompt("Insert number of points to win")));        

        


    </script>
</body>
</html>
